name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Public values only: everything in a Vite build ends up in the browser.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_COMPANY_NAME: ${{ vars.VITE_COMPANY_NAME }}
        run: |
          test -n "$VITE_API_URL" || { echo "Set the VITE_API_URL variable on the staging environment"; exit 1; }
          test -n "$VITE_SUPPORT_EMAIL" || { echo "Set the VITE_SUPPORT_EMAIL variable (shown on Privacy/Terms)"; exit 1; }
          npm run build
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          if echo "$SSH_KEY" | base64 -d >/dev/null 2>&1 && [[ "$SSH_KEY" != *"BEGIN"* ]]; then
            echo "$SSH_KEY" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
      - name: Upload build
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          FRONTEND_DIR: ${{ vars.FRONTEND_DIR || '/srv/admart/frontend' }}
        run: rsync -az --delete dist/ "$TARGET:$FRONTEND_DIR/"
