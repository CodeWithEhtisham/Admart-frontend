name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Public values only: everything in a Vite build ends up in the browser.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_COMPANY_NAME: ${{ vars.VITE_COMPANY_NAME }}
        run: |
          test -n "$VITE_API_URL" || { echo "Set the VITE_API_URL variable on the staging environment"; exit 1; }
          test -n "$VITE_SUPPORT_EMAIL" || { echo "Set the VITE_SUPPORT_EMAIL variable (shown on Privacy/Terms)"; exit 1; }
          npm run build
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          python3 - << 'PYEOF'
          import os, sys, textwrap
          raw = os.environ.get("SSH_KEY", "").strip()
          if not raw:
              print("::error::SSH_KEY secret is empty or missing!", file=sys.stderr)
              sys.exit(1)
          if raw.startswith("ssh-ed25519") or raw.startswith("ssh-rsa") or raw.startswith("ecdsa-"):
              print("::error::SSH_KEY secret contains a PUBLIC key instead of a PRIVATE key! It must start with '-----BEGIN OPENSSH PRIVATE KEY-----'", file=sys.stderr)
              sys.exit(1)
          header = "-----BEGIN OPENSSH PRIVATE KEY-----"
          footer = "-----END OPENSSH PRIVATE KEY-----"
          if header in raw and footer in raw:
              body = raw.split(header)[1].split(footer)[0].replace(" ", "").replace("\n", "").replace("\r", "")
              clean_key = f"{header}\n" + "\n".join(textwrap.wrap(body, 70)) + f"\n{footer}\n"
          else:
              clean_key = raw.replace("\r", "") + "\n"
          ssh_path = os.path.expanduser("~/.ssh/id_ed25519")
          with open(ssh_path, "w") as f:
              f.write(clean_key)
          os.chmod(ssh_path, 0o600)
          print("SSH key written successfully.")
          PYEOF
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519
      - name: Upload build
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          FRONTEND_DIR: ${{ vars.FRONTEND_DIR || '/srv/admart/frontend' }}
        run: rsync -az --delete dist/ "$TARGET:$FRONTEND_DIR/"
